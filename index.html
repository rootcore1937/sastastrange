<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Hands</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #webcam {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.82;
    }

    #effect-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #title {
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 300;
    }

    #status-pill {
      padding: 6px 22px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.4s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.35);
    }

    #status-pill.portal {
      background: rgba(255, 185, 0, 0.18);
      color: #FFD700;
      border-color: rgba(255, 185, 0, 0.4);
      box-shadow: 0 0 22px rgba(255, 185, 0, 0.25);
    }

    #status-pill.fireball {
      background: rgba(255, 70, 0, 0.18);
      color: #FF6600;
      border-color: rgba(255, 70, 0, 0.4);
      box-shadow: 0 0 22px rgba(255, 70, 0, 0.25);
    }

    #hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.1em;
      z-index: 20;
      white-space: nowrap;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .load-ring {
      width: 56px;
      height: 56px;
      border: 3px solid rgba(255, 185, 0, 0.15);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #load-text {
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div id="loading-screen">
    <div class="load-ring"></div>
    <div id="load-text">Loading Hand Model…</div>
  </div>

  <div id="container">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="effect-canvas"></canvas>

    <div id="hud">
      <div id="title">✦ Magic Hands ✦</div>
      <div id="status-pill">NO HANDS DETECTED</div>
    </div>

    <div id="hint">1 HAND → 🔥 FIREBALL &nbsp;·&nbsp; 2 HANDS → 🌀 RING PORTALS</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ── State ──────────────────────────────────────────────────────
    let config = null;
    let handsDetected = 0;
    let handData = []; // [{x, y}, ...]  — smoothed positions per hand

    // Per-hand smooth targets
    let targets = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
    let smoothed = [{ x: 0, y: 0 }, { x: 0, y: 0 }];

    const canvas = document.getElementById('effect-canvas');
    const ctx = document.getElementById('effect-canvas').getContext('2d');
    const video = document.getElementById('webcam');
    const pill = document.getElementById('status-pill');
    const loadSc = document.getElementById('loading-screen');

    let t = 0;
    // Portal sparks per hand
    let sparks = [[], []];
    // Fireball particles (only one hand active)
    let fireParticles = [];

    // ── Config ─────────────────────────────────────────────────────
    async function loadConfig() {
      const res = await fetch('/effects.json');
      config = await res.json();
    }

    // ── Canvas resize ──────────────────────────────────────────────
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ── Status pill ────────────────────────────────────────────────
    function updateStatus(count) {
      if (count === 0) {
        pill.textContent = 'NO HANDS DETECTED';
        pill.className = '';
      } else if (count === 1) {
        pill.textContent = '🔥 FIREBALL';
        pill.className = 'fireball';
      } else {
        pill.textContent = '🌀 RING PORTALS';
        pill.className = 'portal';
      }
    }

    // ── Palm center from MediaPipe landmarks ───────────────────────
    function getPalmCenter(lm) {
      const pts = [0, 5, 9, 13, 17];
      let sx = 0, sy = 0;
      pts.forEach(i => { sx += lm[i].x; sy += lm[i].y; });
      return { x: sx / pts.length, y: sy / pts.length };
    }

    function lmToCanvas(norm) {
      return {
        x: (1 - norm.x) * canvas.width,   // mirror X
        y: norm.y * canvas.height,
      };
    }

    // ── Smooth lerp ───────────────────────────────────────────────
    const SMOOTH = 0.18;
    function lerpPos(cur, tgt) {
      cur.x += (tgt.x - cur.x) * SMOOTH;
      cur.y += (tgt.y - cur.y) * SMOOTH;
    }

    // ═══════════════════════════════════════════════════════════════
    //  PORTAL RING  (one ring per hand)
    // ═══════════════════════════════════════════════════════════════
    // ============================================================
    //  Beautiful Portal Effect — Enhanced Version
    //  Drop into any HTML page with a <canvas id="portalCanvas">
    //  and call:  const portal = new Portal('portalCanvas', options)
    // ============================================================

    class Portal {
      constructor(canvasId, options = {}) {
        this.canvas = typeof canvasId === 'string'
          ? document.getElementById(canvasId)
          : canvasId;
        this.ctx = this.canvas.getContext('2d');
        this.t = 0;
        this.mouseX = null;
        this.mouseY = null;
        this.animId = null;

        // Config
        this.cfg = Object.assign({
          palette: 'fire',   // 'fire' | 'arcane' | 'ice' | 'void'
          speed: 1.0,
          intensity: 1.0,
          numSparks: 90,
          numDust: 60,
          numStreamers: 8,
        }, options);

        this.PALETTES = {
          fire: { core: '#fff8e0', inner: '#ffcc55', mid: '#ff6820', outer: '#ff2200', ring1: '#ff9933', ring2: '#ffcc44', ring3: '#cc3300', glow: '#ff6600', void1: 'rgba(255,200,80,0.18)', void2: 'rgba(255,100,0,0.1)', spark: 'rgba(255,220,120,', haze: 'rgba(255,80,0,' },
          arcane: { core: '#f0e8ff', inner: '#cc88ff', mid: '#7733ff', outer: '#3300cc', ring1: '#aa55ff', ring2: '#dd99ff', ring3: '#5500aa', glow: '#9933ff', void1: 'rgba(200,140,255,0.18)', void2: 'rgba(100,50,255,0.1)', spark: 'rgba(220,180,255,', haze: 'rgba(100,0,255,' },
          ice: { core: '#f0fbff', inner: '#88ddff', mid: '#2299ee', outer: '#0044aa', ring1: '#55aaff', ring2: '#aaddff', ring3: '#0066cc', glow: '#0099ff', void1: 'rgba(140,220,255,0.18)', void2: 'rgba(0,100,200,0.1)', spark: 'rgba(180,230,255,', haze: 'rgba(0,120,255,' },
          void: { core: '#fff0f8', inner: '#ff88cc', mid: '#cc0088', outer: '#660044', ring1: '#ff44aa', ring2: '#ff99dd', ring3: '#990066', glow: '#ff0099', void1: 'rgba(255,140,200,0.18)', void2: 'rgba(180,0,120,0.1)', spark: 'rgba(255,180,230,', haze: 'rgba(200,0,150,' },
        };

        this.sparks = [];
        this.dust = [];
        this.streamers = [];

        this._init();
        this._bindEvents();
        this.start();
      }

      // ----------------------------------------------------------
      //  Public API
      // ----------------------------------------------------------

      setPalette(name) { if (this.PALETTES[name]) this.cfg.palette = name; }
      setSpeed(v) { this.cfg.speed = Math.max(0.1, Math.min(5, v)); }
      setIntensity(v) { this.cfg.intensity = Math.max(0.1, Math.min(3, v)); }

      start() {
        if (this.animId) return;
        const loop = () => { this._draw(); this.animId = requestAnimationFrame(loop); };
        this.animId = requestAnimationFrame(loop);
      }

      stop() {
        if (this.animId) { cancelAnimationFrame(this.animId); this.animId = null; }
      }

      destroy() {
        this.stop();
        this.canvas.removeEventListener('mousemove', this._onMouseMove);
        this.canvas.removeEventListener('mouseleave', this._onMouseLeave);
        window.removeEventListener('resize', this._onResize);
      }

      // ----------------------------------------------------------
      //  Init
      // ----------------------------------------------------------

      _init() {
        this._resize();
        this.sparks = Array.from({ length: this.cfg.numSparks }, () => this._makeSpark());
        this.dust = Array.from({ length: this.cfg.numDust }, () => this._makeDust());
        this.streamers = Array.from({ length: this.cfg.numStreamers }, () => this._makeStreamer());
      }

      _bindEvents() {
        this._onResize = () => this._resize();
        this._onMouseMove = (e) => {
          const r = this.canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          this.mouseX = (e.clientX - r.left) * dpr;
          this.mouseY = (e.clientY - r.top) * dpr;
        };
        this._onMouseLeave = () => { this.mouseX = null; this.mouseY = null; };

        window.addEventListener('resize', this._onResize);
        this.canvas.addEventListener('mousemove', this._onMouseMove);
        this.canvas.addEventListener('mouseleave', this._onMouseLeave);
      }

      _resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = this.canvas.getBoundingClientRect();
        this.W = this.canvas.width = rect.width * dpr;
        this.H = this.canvas.height = rect.height || Math.round(rect.width * 0.6) * dpr;
        if (!rect.height) this.canvas.style.height = (this.H / dpr) + 'px';
        this.cx = this.W / 2;
        this.cy = this.H / 2;
      }

      // ----------------------------------------------------------
      //  Particle factories
      // ----------------------------------------------------------

      _makeSpark() {
        return {
          angle: Math.random() * Math.PI * 2,
          r: 0.82 + Math.random() * 0.38,
          speed: (0.008 + Math.random() * 0.022) * (Math.random() < 0.5 ? 1 : -1),
          size: Math.random() * 2.8 + 0.8,
          life: Math.random(),
          maxLife: 0.4 + Math.random() * 0.9,
          wobble: (Math.random() - 0.5) * 0.12,
          trail: [],
        };
      }

      _makeDust() {
        const a = Math.random() * Math.PI * 2;
        const rd = 0.55 + Math.random() * 0.55;
        return {
          x: Math.cos(a) * rd,
          y: Math.sin(a) * rd,
          vx: (Math.random() - 0.5) * 0.004,
          vy: (Math.random() - 0.5) * 0.004,
          size: Math.random() * 1.4 + 0.4,
          life: Math.random(),
          maxLife: 0.6 + Math.random() * 1.5,
        };
      }

      _makeStreamer() {
        return {
          angle: Math.random() * Math.PI * 2,
          len: 0.3 + Math.random() * 0.5,
          speed: (0.005 + Math.random() * 0.012) * (Math.random() < 0.5 ? 1 : -1),
          width: 0.8 + Math.random() * 1.8,
          life: Math.random(),
          maxLife: 1.0 + Math.random() * 2.0,
        };
      }

      // ----------------------------------------------------------
      //  Hex → rgba helper
      // ----------------------------------------------------------

      _hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
      }

      // ----------------------------------------------------------
      //  Main draw
      // ----------------------------------------------------------

      _draw() {
        const { ctx, cx, cy, W, H, t } = this;
        const p = this.PALETTES[this.cfg.palette];
        const sp = this.cfg.speed;
        const baseR = Math.min(W, H) * 0.28;
        const pulse = 1 + Math.sin(t * 1.3) * 0.03 + Math.sin(t * 3.7) * 0.01;
        const R = baseR * pulse;
        const mouseI = (this.mouseX !== null)
          ? Math.hypot(this.mouseX - cx, this.mouseY - cy) / (R * 2.5)
          : 0.5;
        const glowB = this.cfg.intensity * (1 + (1 - Math.min(mouseI, 1)) * 0.4);

        ctx.clearRect(0, 0, W, H);

        // ---- Background nebula halos ----
        for (let i = 0; i < 3; i++) {
          const hazeR = R * (2.2 - i * 0.35);
          const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, hazeR);
          const a1 = (0.09 - i * 0.025) * glowB;
          const a2 = (0.04 - i * 0.01) * glowB;
          halo.addColorStop(0, p.haze + a1 + ')');
          halo.addColorStop(0.5, p.haze + a2 + ')');
          halo.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = halo;
          ctx.beginPath(); ctx.arc(cx, cy, hazeR, 0, Math.PI * 2); ctx.fill();
        }

        // ---- Void core ----
        const voidG = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.72);
        voidG.addColorStop(0, p.void1);
        voidG.addColorStop(0.4, p.void2);
        voidG.addColorStop(0.75, 'rgba(0,0,0,0.5)');
        voidG.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = voidG;
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.72, 0, Math.PI * 2); ctx.fill();

        // ---- Inner eye glow ----
        const eyeG = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.38);
        eyeG.addColorStop(0, this._hexToRgba(p.core, 0.55));
        eyeG.addColorStop(0.5, this._hexToRgba(p.inner, 0.18));
        eyeG.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = eyeG;
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.38, 0, Math.PI * 2); ctx.fill();

        // ---- Streamers (volumetric light rays) ----
        this.streamers.forEach((s, i) => {
          s.angle += s.speed * sp;
          s.life += 0.008 * sp;
          if (s.life > s.maxLife) { this.streamers[i] = this._makeStreamer(); return; }
          const fade = Math.sin((s.life / s.maxLife) * Math.PI) * 0.6;
          const innerR = R * 0.12;
          const outerR = R * s.len;
          const sweepW = (s.width / R) * 0.18;
          const g = ctx.createLinearGradient(
            cx + Math.cos(s.angle) * innerR, cy + Math.sin(s.angle) * innerR,
            cx + Math.cos(s.angle) * outerR, cy + Math.sin(s.angle) * outerR
          );
          g.addColorStop(0, this._hexToRgba(p.inner, fade * glowB));
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(s.angle);
          ctx.beginPath();
          ctx.moveTo(innerR, 0);
          ctx.lineTo(outerR * Math.cos(sweepW / 2), outerR * Math.sin(sweepW / 2));
          ctx.lineTo(outerR * Math.cos(-sweepW / 2), outerR * Math.sin(-sweepW / 2));
          ctx.closePath();
          ctx.fillStyle = g;
          ctx.fill();
          ctx.restore();
        });

        // ---- Spinning rings ----
        const rings = [
          { r: R, w: 5, rot: t * sp * 0.70, dash: [R * 0.14, R * 0.08], col: p.ring1, gw: 18 },
          { r: R * 0.83, w: 2.5, rot: -t * sp * 0.95, dash: [R * 0.08, R * 0.12], col: p.ring2, gw: 10 },
          { r: R * 1.14, w: 1.8, rot: t * sp * 0.45, dash: [R * 0.24, R * 0.16], col: p.ring3, gw: 8 },
          { r: R * 1.32, w: 1, rot: -t * sp * 0.28, dash: [R * 0.06, R * 0.28], col: p.ring1, gw: 5 },
          { r: R * 0.64, w: 1.2, rot: t * sp * 1.60, dash: [R * 0.05, R * 0.18], col: p.ring2, gw: 6 },
        ];

        rings.forEach(ring => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(ring.rot);
          // Multi-pass glow
          for (let g = 3; g >= 1; g--) {
            ctx.shadowBlur = ring.gw * g * glowB;
            ctx.shadowColor = ring.col;
            ctx.strokeStyle = ring.col;
            ctx.lineWidth = ring.w * (1 + (g - 1) * 0.5);
            ctx.globalAlpha = 0.15 / g;
            ctx.setLineDash(ring.dash);
            ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI * 2); ctx.stroke();
          }
          // Crisp top pass
          ctx.globalAlpha = 1;
          ctx.shadowBlur = ring.gw * glowB;
          ctx.shadowColor = ring.col;
          ctx.strokeStyle = ring.col;
          ctx.lineWidth = ring.w;
          ctx.setLineDash(ring.dash);
          ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        });

        // ---- Dust motes ----
        this.dust.forEach((d, i) => {
          d.x += d.vx * sp;
          d.y += d.vy * sp;
          d.life += 0.005 * sp;
          if (d.life > d.maxLife || Math.hypot(d.x, d.y) > 1.5) { this.dust[i] = this._makeDust(); return; }
          const fade = Math.sin((d.life / d.maxLife) * Math.PI) * 0.5;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.globalAlpha = fade * glowB;
          ctx.fillStyle = p.inner;
          ctx.shadowBlur = 4;
          ctx.shadowColor = p.inner;
          ctx.beginPath();
          ctx.arc(d.x * R, d.y * R, d.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // ---- Sparks with trails ----
        this.sparks.forEach((s, i) => {
          s.angle += s.speed * sp;
          s.life += 0.012 * sp;
          if (s.life > s.maxLife) { this.sparks[i] = this._makeSpark(); return; }
          const fade = Math.sin((s.life / s.maxLife) * Math.PI);
          const wobR = s.r + s.wobble * Math.sin(s.life * 8 + i);
          const sr = wobR * R;
          const sx = cx + Math.cos(s.angle) * sr;
          const sy = cy + Math.sin(s.angle) * sr;

          // Trail
          s.trail.push({ x: sx, y: sy });
          if (s.trail.length > 12) s.trail.shift();
          if (s.trail.length > 2) {
            ctx.beginPath();
            ctx.moveTo(s.trail[0].x, s.trail[0].y);
            for (let k = 1; k < s.trail.length; k++) ctx.lineTo(s.trail[k].x, s.trail[k].y);
            ctx.strokeStyle = p.spark + (fade * 0.35) + ')';
            ctx.lineWidth = s.size * fade * 0.7;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.glow;
            ctx.setLineDash([]);
            ctx.stroke();
          }

          // Spark head
          ctx.save();
          ctx.shadowBlur = 10 * glowB;
          ctx.shadowColor = p.glow;
          ctx.fillStyle = p.spark + (fade * 0.95) + ')';
          ctx.globalAlpha = fade;
          ctx.beginPath(); ctx.arc(sx, sy, s.size * fade * 1.1, 0, Math.PI * 2); ctx.fill();
          // Bright core
          ctx.fillStyle = p.core;
          ctx.shadowBlur = 4;
          ctx.beginPath(); ctx.arc(sx, sy, s.size * fade * 0.45, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        });

        // ---- Edge vignette ----
        const vig = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 2.2);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.88)');
        ctx.fillStyle = vig;
        ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.fill();

        this.t += 0.016 * sp;
      }
    }

    // ----------------------------------------------------------
    //  Auto-init if a canvas#portalCanvas exists on the page
    // ----------------------------------------------------------
    if (typeof document !== 'undefined') {
      document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('portalCanvas');
        if (el) window._portal = new Portal(el);
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  FIREBALL
    // ═══════════════════════════════════════════════════════════════
    function createFireParticle(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3.8 + 0.7;
      return {
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - Math.random() * 2.2,
        life: 1.0,
        decay: Math.random() * 0.024 + 0.011,
        size: Math.random() * 24 + 8,
        isEmber: Math.random() < 0.18,
      };
    }

    function drawFireball(x, y, cfg) {
      // Spawn new particles each frame
      for (let i = 0; i < 6; i++) fireParticles.push(createFireParticle(x, y));

      // Outer glow
      ctx.save();
      const glowG = ctx.createRadialGradient(x, y, 0, x, y, cfg.glowRadius * 1.9);
      glowG.addColorStop(0, 'rgba(255,130,0,0.32)');
      glowG.addColorStop(0.45, 'rgba(255,40,0,0.12)');
      glowG.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowG;
      ctx.beginPath(); ctx.arc(x, y, cfg.glowRadius * 1.9, 0, Math.PI * 2); ctx.fill();

      // Particles
      fireParticles = fireParticles.filter(p => p.life > 0);
      fireParticles.forEach(p => {
        p.x += p.vx + (Math.random() - 0.5) * cfg.turbulence;
        p.y += p.vy + (Math.random() - 0.5) * cfg.turbulence;
        p.life -= p.decay;
        p.size *= 0.972;

        let color;
        const a = p.life;
        if (p.isEmber) color = `rgba(255,110,0,${a * 0.85})`;
        else if (a > 0.70) color = `rgba(255,255,190,${a})`;
        else if (a > 0.45) color = `rgba(255,165,0,${a})`;
        else if (a > 0.20) color = `rgba(255,50,0,${a})`;
        else color = `rgba(70,25,8,${a * 0.45})`;

        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = p.isEmber ? 10 : 22;
        ctx.shadowColor = p.isEmber ? '#FF4500' : '#FF6600';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Bright white-hot core
      ctx.globalCompositeOperation = 'lighter';
      const coreG = ctx.createRadialGradient(x, y, 0, x, y, 40);
      coreG.addColorStop(0, 'rgba(255,255,255,0.96)');
      coreG.addColorStop(0.22, 'rgba(255,255,160,0.82)');
      coreG.addColorStop(0.55, 'rgba(255,110,0,0.45)');
      coreG.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = coreG;
      ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    // ═══════════════════════════════════════════════════════════════
    //  RENDER LOOP
    // ═══════════════════════════════════════════════════════════════
    function render() {
      t += 0.016;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!config) { requestAnimationFrame(render); return; }

      const count = handsDetected;

      if (count === 1) {
        // ── ONE HAND → FIREBALL ──
        lerpPos(smoothed[0], targets[0]);
        drawFireball(smoothed[0].x, smoothed[0].y, config.effects.fireball);
        // let any leftover portal sparks fade
        sparks[0] = []; sparks[1] = [];

      } else if (count === 2) {
        // ── TWO HANDS → RING PORTALS ──
        fireParticles = fireParticles.filter(p => { p.life -= 0.06; return p.life > 0; });
        // Draw decaying fire particles so it doesn't snap away
        fireParticles.forEach(p => {
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = `rgba(255,80,0,${p.life * 0.35})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        });

        for (let h = 0; h < 2; h++) {
          lerpPos(smoothed[h], targets[h]);
          ensureSparks(h, config.effects.portal.sparkCount);
          drawPortal(smoothed[h].x, smoothed[h].y, sparks[h], config.effects.portal);
        }

      } else {
        // ── NO HANDS → fade everything out ──
        fireParticles = fireParticles.filter(p => { p.life -= 0.05; return p.life > 0; });
        fireParticles.forEach(p => {
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = `rgba(255,70,0,${p.life * 0.3})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.35, 0, Math.PI * 2); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        });
        sparks[0] = []; sparks[1] = [];
      }

      requestAnimationFrame(render);
    }

    // ═══════════════════════════════════════════════════════════════
    //  MEDIAPIPE HANDS
    // ═══════════════════════════════════════════════════════════════
    async function initHandTracking() {
      const hands = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.72,
        minTrackingConfidence: 0.62,
      });

      hands.onResults(results => {
        const lms = results.multiHandLandmarks || [];
        handsDetected = lms.length;
        updateStatus(handsDetected);

        lms.forEach((lm, i) => {
          if (i > 1) return;
          const palm = getPalmCenter(lm);
          const cv = lmToCanvas(palm);
          targets[i].x = cv.x;
          targets[i].y = cv.y;
          // Snap on first detection
          if (smoothed[i].x === 0 && smoothed[i].y === 0) {
            smoothed[i].x = cv.x;
            smoothed[i].y = cv.y;
          }
        });
      });

      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 1280, height: 720,
      });

      await camera.start();
      setTimeout(() => loadSc.classList.add('hidden'), 900);
      render();
    }

    // ── Boot ──────────────────────────────────────────────────────
    (async () => {
      await loadConfig();
      await initHandTracking();
    })();
  </script>
</body>

</html>
